[package]
name = "rammap-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "In-browser read mapping and alignment: rammap compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned by rev: rammap publishes no tags and is not on crates.io. Re-check
# RAMMAP_VERSION in src/sam.rs whenever this moves.
#
# default-features = false drops `parallel` (rayon). Without SharedArrayBuffer rayon
# cannot spawn workers, and IndexBuilder::finish falls back to a sequential bucket sort.
rammap-core = { git = "https://github.com/jwanglab/rammap.git", rev = "a6ea7aa7423bbc878c7547995df2c49d4139a793", default-features = false }

wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3.77", features = ["console"] }
# std::time::Instant::now() traps on wasm32-unknown-unknown.
web-time = "1"
# Newline scanning in the chunked query parser, over potentially many GB.
memchr = "2.7"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# rammap is compute-bound: the hot path is banded DP (align/dp/*) and SIMD anchor
# chaining. Optimise for speed like sparrowhawk's esm-bridge, not for size like
# orphos-bridge. Costs roughly 2.5-4 MB of .wasm; opt-level = "z" would about halve
# that but at a large multiple on DP throughput, which is the whole product.
opt-level = 3
lto = "fat"
codegen-units = 1
# wasm has no unwinding anyway; stating it drops the landing pads. Panic hooks still
# run, so diagnostics are unaffected.
panic = "abort"
strip = "debuginfo"
